<!doctype html>
<html lang="ja">
<head>

<title>テーマと12 Steps｜Grow Happy けいけんデータベース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="themes" data-area="guest">
<header id="site-header"></header>

<main class="container">

<section class="stack" id="themes">
<div class="stack" style="gap:6px">

</div>
<div class="theme-list" id="theme-list"></div>

<section class="steps-band" id="steps" style="align-items:stretch">
<div class="txt" style="flex-basis:100%">
<span class="pill">12 STEPS</span>

<p>里親さんの声から生まれた12のスキルです。ステップを選ぶと、そのスキルを表す言葉と、関連するストーリーへの入り口が表示されます。</p>

</div>

<ol class="step-list" id="step-list"></ol>
<div class="step-detail" id="step-detail" aria-live="polite"></div>
</div>
</section>

</main>

<footer id="site-footer"></footer>
