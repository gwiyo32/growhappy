<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>会員登録・ログイン｜Grow Happy けいけんデータベース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Quicksand:wght@500;600;700&display=swap">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/favicon-180.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="signup" data-area="guest">
<header id="site-header"></header>

<main class="container">
<div class="auth-wrap">
<div class="auth-brand">
<img src="assets/img/logo.svg" alt="growhappy" width="748" height="142">
<p>里親・養育者のための けいけんデータベース</p>
</div>
<div class="tabs" role="tablist" aria-label="会員登録とログイン">
<button type="button" class="tab" role="tab" data-mode="signup" aria-controls="signup-form" aria-selected="true">会員登録</button>
<button type="button" class="tab" role="tab" data-mode="login" aria-controls="login-form" aria-selected="false">ログイン</button>
</div>

<form class="card form" id="signup-form" novalidate>
<div class="stack">
<div class="stack" style="gap:4px">
<h1 style="font-size:22px">はじめまして！</h1>
<p class="note">無料で登録すると、すべてのストーリーを探して読めます。</p>
</div>
<p class="form-error" role="alert" hidden></p>
<div class="field"><label for="nick">ニックネーム</label><input class="input" id="nick" name="nick" autocomplete="nickname" placeholder="サイト内で表示されます"></div>
<div class="field"><label for="email">メールアドレス</label><input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="example@mail.com"></div>
<div class="field"><label for="password">パスワード</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="8文字以上"></div>
<fieldset class="field">
<legend>あてはまるもの（任意）</legend>
<div class="radio-pills">
<label class="radio-pill t-arrival"><input type="radio" name="role" value="foster">里親</label>
<label class="radio-pill t-support"><input type="radio" name="role" value="carer">養育者・施設職員</label>
<label class="radio-pill t-daily"><input type="radio" name="role" value="future">これから里親に</label>
<label class="radio-pill t-teen"><input type="radio" name="role" value="other">その他</label>
</div>
</fieldset>
<label class="agree"><input type="checkbox" name="agree" id="agree"><span><a href="#">利用規約</a>と<a href="#">プライバシーポリシー</a>に同意します</span></label>
<button type="submit" class="btn btn-primary btn-lg btn-block">登録する</button>
</div>
</form>

<form class="card form" id="login-form" novalidate hidden>
<div class="stack">
<h1 style="font-size:22px">おかえりなさい</h1>
<p class="form-error" role="alert" hidden></p>
<div class="field"><label for="login-email">メールアドレス</label><input class="input" id="login-email" name="email" type="email" autocomplete="email"></div>
<div class="field"><label for="login-password">パスワード</label><input class="input" id="login-password" name="password" type="password" autocomplete="current-password"></div>
<button type="submit" class="btn btn-primary btn-lg btn-block">ログイン</button>
<a href="#" style="align-self:center;font-size:13px">パスワードを忘れた方</a>
</div>
</form>

<p class="demo-note">※試作版のため、入力内容はこのブラウザにだけ保存され、どこにも送信されません。</p>
</div>
</main>

<footer id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
